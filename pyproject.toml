[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lilrae"
description = "The complete personal and local backend for the Reproducible Agentic Environments System."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
requires-python = ">=3.11"
authors = [{ name = "Brad Edwards" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["raes==3.0.0"]

[project.scripts]
lilrae = "lilrae.cli:main"

[project.urls]
Homepage = "https://github.com/RAESystem/lilrae"
Issues = "https://github.com/RAESystem/lilrae/issues"
Source = "https://github.com/RAESystem/lilrae"

[dependency-groups]
dev = [
  "coverage>=7.10,<8",
  "hatchling>=1.27,<2",
  "mypy>=2.3.0,<3",
  "pre-commit>=4.3,<5",
  "pre-commit-hooks>=5,<6",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pyyaml>=6.0.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.version]
path = "src/lilrae/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lilrae"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/tools",
  "/policy",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["lilrae", "tools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tools", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PERF",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"tools/check_hygiene.py" = ["S603"]
"tools/policy_common.py" = ["UP004"]
"tools/check_repo_policy.py" = ["S603"]
