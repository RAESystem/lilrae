sonar.projectKey=Brad-Edwards_lilrae
sonar.organization=brad-edwards
sonar.projectName=LilRAE

# The project is assigned to the Python-Strict quality profile and the
# raes-hub-strict quality gate in SonarCloud. The gate fails on any new issue.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

sonar.sources=src,tools
sonar.tests=tests
sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/build/**,\
  **/dist/**,\
  **/*.egg-info/**
