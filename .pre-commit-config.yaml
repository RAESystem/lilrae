fail_fast: true
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: lilrae-pre-commit
        name: LilRAE pre-commit gate
        entry: >-
          bash -c 'unset $(git rev-parse --local-env-vars);
          uv tool run --from "nox[uv]==2026.4.10"
          nox -f noxfile.py -s hook-pre-commit'
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]
      - id: lilrae-pre-push
        name: LilRAE pre-push gate
        entry: >-
          bash -c 'unset $(git rev-parse --local-env-vars);
          uv tool run --from "nox[uv]==2026.4.10"
          nox -f noxfile.py -s hook-pre-push'
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
